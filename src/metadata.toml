#:schema https://raw.githubusercontent.com/yunanwg/brilliant-CV/main/metadata.toml.schema.json

# Contact block, layout and ATS keyword list. Section content lives under
# sections/.

header_quote = "Senior Machine Learning Engineer · 9+ years building ML systems and data pipelines"

cv_footer = "Curriculum vitae"
letter_footer = "Cover letter"

[layout]
    awesome_color = "#1F3A5C"
    before_section_skip = "6pt"
    before_entry_skip = "3pt"
    before_entry_description_skip = "2pt"
    paper_size = "a4"
    date_width = "3.4cm"

    [layout.fonts]
        # Source Sans 3 and Roboto are vendored under fonts/ (passed via
        # --font-path), so they resolve identically everywhere.
        regular_fonts = ["Source Sans 3", "Libertinus Serif"]
        # One typeface throughout. Roboto was only used for the name and the
        # section headings, and the mix read as decorative rather than deliberate.
        header_font = "Source Sans 3"

    [layout.header]
        header_align = "left"
        display_profile_photo = false
        info_font_size = "9.5pt"

    [layout.entry]
        # true: society bold on top, role below (also required for the
        # cv-entry-start / cv-entry-continued grouping used in professional.typ)
        display_entry_society_first = true
        display_logo = false

    [layout.section]
        # "none": section titles render in a single colour. The first-letters
        # treatment tinted the first three characters of every heading, which is
        # the most decorative thing on the page.
        title_highlight = "none"

    [layout.footer]
        display_page_counter = true
        display_footer = true

