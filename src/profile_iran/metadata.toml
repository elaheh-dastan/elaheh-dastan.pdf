#:schema https://raw.githubusercontent.com/yunanwg/brilliant-CV/main/metadata.toml.schema.json

# Iran profile — content lives under shared/, only the contact block differs
# between profiles. Switch via: typst compile cv.typ --input profile=iran

header_quote = "Senior Machine Learning Engineer · 7+ years building ML systems and data pipelines"

cv_footer = "Curriculum vitae"
letter_footer = "Cover letter"

[layout]
    awesome_color = "#262F99"
    before_section_skip = "6pt"
    before_entry_skip = "4pt"
    before_entry_description_skip = "3pt"
    paper_size = "a4"
    date_width = "3.4cm"

    [layout.fonts]
        # Source Sans 3 and Roboto are vendored under fonts/ (passed via
        # --font-path), so they resolve identically everywhere.
        regular_fonts = ["Source Sans 3", "Libertinus Serif"]
        header_font = "Roboto"

    [layout.header]
        header_align = "left"
        display_profile_photo = false
        info_font_size = "9.5pt"

    [layout.entry]
        # true: society bold on top, role below (also required for the
        # cv-entry-start / cv-entry-continued grouping used in professional.typ)
        display_entry_society_first = true
        display_logo = false

    [layout.section]
        title_highlight = "first-letters"
        title_highlight_letters = 3

    [layout.footer]
        display_page_counter = true
        display_footer = true

[inject]
    injected_keywords_list = [
        "Python", "PyTorch", "TensorFlow", "Machine Learning", "Deep Learning",
        "LLM", "Large Language Models", "Agentic AI", "LLM Agents",
        "LLM-as-Judge", "Pydantic AI", "LangChain", "LangGraph", "Langfuse",
        "RAG", "Vector Database", "Qdrant", "Semantic Search", "Elasticsearch",
        "Recommendation Systems", "Information Retrieval", "CLIP", "BERT",
        "Transformers", "HuggingFace", "NLP", "Computer Vision",
        "Time Series Forecasting", "LSTM", "Prophet", "XGBoost", "LightGBM",
        "Scikit-learn", "Pandas", "NumPy", "A/B Testing", "Experiment Design",
        "Feature Engineering", "ETL", "MLOps", "LLMOps", "MLflow", "Airflow",
        "Kubeflow", "Feast", "Katib", "Spark", "PySpark", "Kafka", "NATS",
        "FastAPI", "Django", "Go", "Golang", "Docker", "Kubernetes",
        "Terraform", "AWS", "GCP", "Azure", "Vertex AI", "SageMaker",
        "PostgreSQL", "MongoDB", "Cassandra", "Redis", "Prometheus", "Grafana",
    ]

[personal]
    first_name = "Elaheh"
    last_name = "Dastan"

    [personal.info]
        email = "elahe.dstn@gmail.com"
        phone = "+98 935 225 7378"
