---
name: typst
on:
  # No `paths:` filter: tag pushes never trigger when `paths` is set, because
  # tagging a commit already on main doesn't carry a diff for the filter to
  # match — which is why the 2024-04-25 release shipped with no assets at all.
  # Build cost is trivial, so trigger on every push to main and on every tag
  # push, then gate the release step on the tag ref.
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      # Source Sans 3 and Roboto are vendored in-repo under fonts/ and passed to
      # typst via --font-path, so they need no install here. Ubuntu's apt only
      # has fonts-font-awesome v4 (we need v7), so download FontAwesome directly.
      # Bump the cache key suffix to force a refresh after changing font versions.
      - name: cache fonts
        id: cache-fonts
        uses: actions/cache@v6
        with:
          path: ~/.local/share/fonts
          key: fonts-fa7.0.1-v1
      - name: download fonts
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/fonts
          cd ~/.local/share/fonts
          curl -fsSL https://use.fontawesome.com/releases/v7.0.1/fontawesome-free-7.0.1-desktop.zip -o /tmp/fa.zip
          unzip -qoj /tmp/fa.zip 'fontawesome-free-*/otfs/*.otf' -d .
      - name: refresh font cache
        run: |
          fc-cache -f
          fc-list | grep -iE "font.awesome" | head
      - name: prepare build dir
        run: mkdir -p build
      - name: compile resume (spain)
        run: typst compile src/cv.typ build/elaheh-spain.pdf --input profile=spain --font-path fonts
      - name: compile resume (iran)
        run: typst compile src/cv.typ build/elaheh-iran.pdf --input profile=iran --font-path fonts
      # elaheh-dastan.github.io links to the release asset literally named
      # elaheh.pdf, so publish the default (spain) variant under that stable
      # name too. Dropping it silently 404s the "Here is my CV" button.
      - name: publish default variant as elaheh.pdf
        run: cp build/elaheh-spain.pdf build/elaheh.pdf
      - name: release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/elaheh.pdf
            build/elaheh-spain.pdf
            build/elaheh-iran.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
